# Apache/mod_wsgi configuration for the cross section API.
#
# Drop this into the site's VirtualHost, or Include it from there.  It is
# separate from radar_cappi_ssl.conf because the daemon group it declares is
# the whole point, and burying that in a larger file is how it gets "tuned"
# later by someone reading it as a performance knob.
#
# ─────────────────────────────────────────────────────────────────────────
#  WHY threads=1
# ─────────────────────────────────────────────────────────────────────────
# The API serves sections out of the IMAGE C engine through pyimage, and the
# engine keeps one composite in process globals.  Two threads in it at once do
# not produce two sections; they produce one composite half loaded with each
# other's frame.  The engine also chdirs the process to the imagegcc checkout
# for its lifetime, so the process cannot be shared with an app that resolves
# a relative path.
#
# So: its own daemon group, one thread per process, and nothing else mounted
# in it.  Concurrency comes from processes, not threads.  Each process holds
# its own archive - about 40 MB - so raise `processes` for more concurrent
# cutters, and leave `threads` alone.
#
# The queue this creates is smaller than it looks.  A cut is two costs: about
# a second to mosaic the frame, and twenty milliseconds to slice it.  The
# worker keeps the last frame it built, so a user drawing a second line across
# the same frame - which is what the page is for - pays only the twenty
# milliseconds.
#
# ─────────────────────────────────────────────────────────────────────────
#  Prerequisites
# ─────────────────────────────────────────────────────────────────────────
#   the imagegcc checkout, built:  cd ~/image && ./make.sh
#   python3 -m pip install pyproj  (already in /opt/radar/venv)
#
# IMAGE_HOME is worked out from $IMAGE_HOME, then ~/image, then ~/imagegcc.
# www-data has no useful home directory, so say it here.

WSGIDaemonProcess xsection \
    user=www-data \
    group=www-data \
    processes=2 \
    threads=1 \
    maximum-requests=500 \
    python-home=/opt/radar/venv \
    python-path=/opt/radar/radar-wms

# maximum-requests recycles a worker every 500 cuts.  The engine is C with a
# long memory: this is the cheap way to keep a slow leak from becoming a
# restart at three in the morning.

WSGIScriptAlias /xsection /opt/radar/radar-wms/xsection_api.wsgi

<Location /xsection>
    WSGIProcessGroup xsection

    # NOT %{GLOBAL}.  The WMS app runs in the global application group inside
    # the radar_wms daemon group; putting this there too would put the engine
    # back in a process with fifteen threads in it.
    WSGIApplicationGroup xsection

    Require all granted

    Header set Access-Control-Allow-Origin  "*"
    Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header set Access-Control-Allow-Headers "Content-Type"
</Location>

# The frame list and the geometry change once every ten minutes; a section is
# the expensive one and is worth a little caching when several people are
# looking at the same weather.
<LocationMatch "^/xsection/(frames|info|legend)">
    Header set Cache-Control "public, max-age=30"
</LocationMatch>
