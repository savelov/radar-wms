# Apache/mod_wsgi configuration for the cross section API.
#
# Include it from inside the site's <VirtualHost>, which on this server is
# /etc/apache2/sites-enabled/radar_cappi.conf:
#
#     Include /opt/radar/radar-wms/image_xsection_apache.conf
#
# Inside, not beside: WSGIDaemonProcess below is declared where the existing
# radar_wms group is declared, and a daemon group declared inside one
# VirtualHost cannot be referenced from another.
#
# It is a file of its own because the daemon group it declares is the whole
# point, and burying that in a larger file is how it gets "tuned" later by
# someone reading threads=1 as a performance knob.
#
# ─────────────────────────────────────────────────────────────────────────
#  THIS IS NOT THE /api CROSS SECTION
# ─────────────────────────────────────────────────────────────────────────
# The deployment already has a cross section service at /api, which reads
# ODIM HDF5 polar volumes from pvol_cache under Flask.  That one cuts through
# one radar's sweeps; this one cuts through the mosaic the IMAGE C engine
# builds from the .wrk archive.  Two services, two engines, two projects that
# are not merged - they share only a subject.
#
# So they get separate mounts, separate daemon groups and separate file names:
# everything here is image_*, and nothing in this file touches /api or the
# radar_wms group.  Mounting this and leaving /api alone is correct and
# intended; they are meant to run side by side.
#
# ─────────────────────────────────────────────────────────────────────────
#  ORDER MATTERS, ONCE
# ─────────────────────────────────────────────────────────────────────────
# radar_cappi.conf sets WSGIProcessGroup radar_wms for the whole of
# <Directory /opt/radar/radar-wms>, and image_xsection_api.wsgi is in there too.
# Apache merges <Location> after <Directory>, so the <Location /xsection>
# below wins and this app lands in its own group.  That is the documented
# order and not an accident, but it is worth knowing that the two disagree
# on purpose - check with:
#
#     sudo apachectl -t -D DUMP_CONFIG | grep -A3 xsection
#
# ─────────────────────────────────────────────────────────────────────────
#  WHY threads=1
# ─────────────────────────────────────────────────────────────────────────
# The API serves sections out of the IMAGE C engine through pyimage, and the
# engine keeps one composite in process globals.  Two threads in it at once do
# not produce two sections; they produce one composite half loaded with each
# other's frame.  The engine also chdirs the process to the imagegcc checkout
# for its lifetime, so the process cannot be shared with an app that resolves
# a relative path.
#
# So: its own daemon group, one thread per process, and nothing else mounted
# in it.  Concurrency comes from processes, not threads.  Each process holds
# its own archive - about 40 MB - so raise `processes` for more concurrent
# cutters, and leave `threads` alone.
#
# The queue this creates is smaller than it looks.  A cut is two costs: about
# a second to mosaic the frame, and twenty milliseconds to slice it.  The
# worker keeps the last frame it built, so a user drawing a second line across
# the same frame - which is what the page is for - pays only the twenty
# milliseconds.
#
# ─────────────────────────────────────────────────────────────────────────
#  Prerequisites
# ─────────────────────────────────────────────────────────────────────────
#   sudo a2enmod wsgi headers        both, and headers is the one that is
#                                    easy to miss - a server that has never
#                                    set a header has no reason to have it,
#                                    and Apache answers a Header directive
#                                    without it by refusing to start:
#                                      Invalid command 'Header', perhaps
#                                      misspelled or defined by a module not
#                                      included in the server configuration
#                                    a2enmod needs a restart, not a reload.
#   the imagegcc checkout, built:  cd ~/image && ./make.sh
#   python3 -m pip install pyproj  (already in /opt/radar/venv)
#
# The engine is found from $IMAGE_HOME, then ~/image, then ~/imagegcc.
# www-data's home is /var/www, so the two fallbacks resolve to nothing and
# IMAGE_HOME has to be set - in image_xsection_api.wsgi, where a commented
# line waits for it.  Not here: mod_wsgi's SetEnv fills the WSGI environ,
# which is not os.environ, and the engine reads os.environ.
#
# www-data must be able to read the checkout, its config/ directory and the
# archive the paths file names.  All three are world-readable today; that is
# luck rather than design, and a checkout under /opt/radar is the tidier home
# for a deployment than one under /home/eugene.

# The four paths below are one deployment's - /opt/radar here.  A checkout
# somewhere else (gimet-wms, a home directory) has to change python-path,
# python-home and the WSGIScriptAlias to match, or Apache starts cleanly and
# every request 500s on a script it cannot find.  And if a WSGIDaemonProcess
# named xsection is already declared elsewhere in the config, Apache refuses
# to start on the duplicate rather than quietly preferring one - Including
# this file means removing the older declaration, not keeping both.
WSGIDaemonProcess xsection \
    user=www-data \
    group=www-data \
    processes=2 \
    threads=1 \
    maximum-requests=500 \
    python-home=/opt/radar/venv \
    python-path=/opt/radar/radar-wms

# maximum-requests recycles a worker every 500 cuts.  The engine is C with a
# long memory: this is the cheap way to keep a slow leak from becoming a
# restart at three in the morning.

WSGIScriptAlias /xsection /opt/radar/radar-wms/image_xsection_api.wsgi

<Location /xsection>
    # WSGIProcessGroup picks the OS processes; WSGIApplicationGroup picks the
    # Python interpreter inside them.  They are independent, and only the
    # first one is what keeps this app away from the WMS: `xsection` above is
    # a different set of processes from `radar_wms` entirely.
    WSGIProcessGroup xsection

    # %{GLOBAL} means the main interpreter, and it has to be that.  Any other
    # value puts the app in a Python sub-interpreter, where C extension
    # modules are documented to misbehave - and this app is almost nothing
    # but C extensions: libimage.so through ctypes, and pyproj.  Naming a
    # group here to "separate" it from the WMS would separate nothing, since
    # the WMS is in other processes, and would break the engine.
    WSGIApplicationGroup %{GLOBAL}

    Require all granted

    # Wrapped, so that a server without mod_headers starts instead of
    # refusing to.  It is only safe to make this optional because the app
    # sends the same three headers itself - see CORS in image_xsection_api.py
    # - so losing these costs a duplicate, not the feature.  Enable the module
    # anyway: the Cache-Control below has no such second home.
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin  "*"
        Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header set Access-Control-Allow-Headers "Content-Type"
    </IfModule>
</Location>

# The frame list and the geometry change once every ten minutes; a section is
# the expensive one and is worth a little caching when several people are
# looking at the same weather.
<IfModule mod_headers.c>
    <LocationMatch "^/xsection/(frames|info|legend)">
        Header set Cache-Control "public, max-age=30"
    </LocationMatch>
</IfModule>
