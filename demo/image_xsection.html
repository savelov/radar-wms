<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertical cross section</title>

<!--
  Draw a line on the map, get the vertical slice under it.

  The cut is made by the IMAGE C engine (crosssect.c), served by
  radar-wms/image_xsection_api.py.  Everything shown here comes from that: the
  values, their units, and the colours.  The colours especially - the API
  hands out the map's own legend rows, and this page colours the section by
  looking a value up in them, so a section and a map of one frame cannot
  disagree about what a colour means.  An invented gradient, however pretty,
  would put the two out of step the day someone edited a palette file.

  The section is drawn on a canvas rather than through a plotting library.
  The legend is seventeen to twenty-two discrete bands, which is a lookup and
  a fillRect; wiring that into a library's continuous colour scale is more
  code than doing it, and pulls in three megabytes to do it with.

  OpenLayers is loaded from the site's vendor directory when it is there and
  from the CDN when it is not, so this works both deployed and opened from a
  checkout.
-->

<!-- The site vendors its libraries under vendor/<name>-<version>/ and caches
     them forever; a checkout has no such directory.  Load the local copy,
     then test for it: a 404 leaves `ol` undefined and the CDN is written in
     before the rest of the page parses.  Testing the symbol rather than
     hanging an onerror on the tag is what makes this reliable - a 404 that
     the browser aborts does not always fire one. -->
<link rel="stylesheet" href="vendor/ol-10.9.0/ol.css">
<script src="vendor/ol-10.9.0/ol.js"></script>
<script>
if (typeof ol === 'undefined') {
  document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">');
  document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></scr' + 'ipt>');
}
</script>

<style>
:root {
  --bg:#060a0f; --surface:#111922; --border:#1e2d3d;
  --accent:#00c8ff; --accent2:#ff6b35;
  --text:#cdd9e5; --muted:#6b7787; --danger:#ff4455;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --panel-w:300px; --hdr-h:42px;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body {
  background:var(--bg); color:var(--text); font-family:var(--sans);
  display:flex; flex-direction:column; overflow:hidden;
}

header {
  height:var(--hdr-h); flex:none; display:flex; align-items:center; gap:14px;
  padding:0 14px; background:var(--surface); border-bottom:1px solid var(--border);
}
header h1 { font-size:.9rem; font-weight:500; margin:0; letter-spacing:.02em; }
header .frame { font-family:var(--mono); font-size:.72rem; color:var(--accent); }
header .frame .z { color:var(--muted); font-size:.62rem; }
header .status { margin-left:auto; display:flex; align-items:center; gap:7px;
                 font-family:var(--mono); font-size:.68rem; color:var(--muted); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
.dot.ok { background:#39ff87; } .dot.bad { background:var(--danger); }

main { flex:1; display:flex; min-height:0; }

aside {
  width:var(--panel-w); flex:none; background:var(--surface);
  border-right:1px solid var(--border); overflow-y:auto; padding:14px;
}
aside section { margin-bottom:18px; }
aside h2 {
  font-size:.62rem; text-transform:uppercase; letter-spacing:.13em;
  color:var(--muted); margin:0 0 8px; font-weight:600;
}
.row { display:flex; gap:6px; flex-wrap:wrap; }
button, select {
  font-family:var(--mono); font-size:.72rem; color:var(--text);
  background:#0b1219; border:1px solid var(--border); border-radius:4px;
  padding:6px 9px; cursor:pointer;
}
button:hover:not(:disabled), select:hover { border-color:var(--accent); }
button.on { background:var(--accent); color:#00131c; border-color:var(--accent);
            font-weight:600; }
button:disabled { opacity:.4; cursor:not-allowed; }
select { width:100%; }
.wide { width:100%; justify-content:center; }
.info {
  font-family:var(--mono); font-size:.68rem; line-height:1.7; color:var(--muted);
  background:#0b1219; border:1px solid var(--border); border-radius:4px; padding:8px 10px;
}
.info b { color:var(--text); font-weight:500; }
.utc { font-family:var(--mono); font-size:.62rem; color:var(--muted); margin-top:5px; }
.utc b { color:var(--accent2); font-weight:500; }
.slider { display:flex; align-items:center; gap:8px; margin-top:7px; }
.slider input { flex:1; accent-color:var(--accent); }
.slider span { font-family:var(--mono); font-size:.64rem; color:var(--accent);
               min-width:34px; text-align:right; }
.warn { font-family:var(--mono); font-size:.6rem; line-height:1.5;
        color:var(--accent2); margin-top:6px; }
button.off { opacity:.35; cursor:not-allowed; }

.right { flex:1; display:flex; flex-direction:column; min-width:0; }
#map { flex:1; min-height:120px; background:#0b1219; position:relative; }
#map .hint {
  position:absolute; z-index:5; top:10px; left:50%; transform:translateX(-50%);
  background:rgba(11,18,25,.92); border:1px solid var(--border); border-radius:4px;
  padding:5px 11px; font-family:var(--mono); font-size:.68rem; color:var(--accent);
  pointer-events:none;
}
.grab { height:6px; flex:none; background:var(--border); cursor:row-resize; }
.grab:hover { background:var(--accent); }

.panel {
  height:300px; flex:none; background:var(--surface);
  border-top:1px solid var(--border); display:flex; flex-direction:column;
}
.panel .bar {
  flex:none; display:flex; align-items:center; gap:12px; padding:6px 12px;
  border-bottom:1px solid var(--border); font-family:var(--mono); font-size:.68rem;
}
.panel .bar .t { color:var(--text); }
.panel .bar .m { color:var(--muted); }
.panel .bar .readout { margin-left:auto; color:var(--accent); }
.plot { flex:1; display:flex; min-height:0; }
#canvas-wrap { flex:1; position:relative; min-width:0; }
#sect { position:absolute; inset:0; width:100%; height:100%; }
#legend {
  width:104px; flex:none; overflow-y:auto; padding:6px 8px;
  border-left:1px solid var(--border); font-family:var(--mono); font-size:.6rem;
}
#legend .lrow { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
#legend .sw { width:13px; height:11px; border-radius:2px; flex:none;
              border:1px solid rgba(255,255,255,.15); }
#legend .lb { color:var(--muted); white-space:nowrap; }

.veil {
  position:fixed; inset:0; background:rgba(6,10,15,.72); z-index:50;
  display:none; align-items:center; justify-content:center; flex-direction:column;
  gap:12px; font-family:var(--mono); font-size:.76rem; color:var(--accent);
}
.veil.on { display:flex; }
.spin { width:26px; height:26px; border:2px solid var(--border);
        border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }

.toast {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:4px; padding:9px 15px; font-family:var(--mono); font-size:.7rem;
  z-index:60; transition:transform .25s; max-width:80vw;
}
.toast.on { transform:translateX(-50%) translateY(0); }
.toast.bad { border-left-color:var(--danger); color:#ffc7cd; }

@media (max-width:820px) {
  aside { position:absolute; z-index:20; height:calc(100% - var(--hdr-h));
          transform:translateX(-100%); transition:transform .2s; }
  aside.open { transform:none; }
  #burger { display:block; }
}
#burger { display:none; }
</style>
</head>
<body>

<header>
  <button id="burger" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
  <h1>Vertical cross section</h1>
  <span class="frame" id="frame-time">—</span>
  <span class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
</header>

<main>
  <aside>
    <section>
      <h2>Quantity</h2>
      <div class="row" id="families"></div>
    </section>

    <section>
      <h2>Time</h2>
      <select id="time" onchange="onTime()"></select>
      <div class="utc" id="time-utc">&mdash;</div>
    </section>

    <section>
      <h2>Radar overlay</h2>
      <select id="wms-layer" onchange="onWmsLayer()">
        <option value="">— none —</option>
      </select>
      <div class="slider">
        <input type="range" min="0" max="100" value="65" id="wms-opacity"
               oninput="onWmsOpacity(this.value)">
        <span id="wms-opacity-val">65%</span>
      </div>
      <div class="warn" id="wms-note"></div>
    </section>

    <section>
      <h2>Line</h2>
      <div class="row">
        <button id="btn-draw" class="on" onclick="setMode('draw')">✎ Draw</button>
        <button onclick="clearLine()">✕ Clear</button>
      </div>
      <div style="height:8px"></div>
      <button class="wide" id="btn-cut" onclick="cut()" disabled>Cut section</button>
    </section>

    <section>
      <h2>Endpoints</h2>
      <div class="info" id="line-info">
        <b>From</b> —<br><b>To</b> —<br><b>Length</b> —
      </div>
    </section>

    <section>
      <h2>Frame</h2>
      <div class="info" id="frame-info">—</div>
    </section>
  </aside>

  <div class="right">
    <div id="map"><div class="hint" id="hint">Click to set the start point</div></div>
    <div class="grab" id="grab"></div>
    <div class="panel">
      <div class="bar">
        <span class="t" id="sect-title">—</span>
        <span class="m" id="sect-meta"></span>
        <span class="readout" id="readout"></span>
      </div>
      <div class="plot">
        <div id="canvas-wrap"><canvas id="sect"></canvas></div>
        <div id="legend"></div>
      </div>
    </div>
  </div>
</main>

<div class="veil" id="veil"><div class="spin"></div><div id="veil-text">Cutting…</div></div>
<div class="toast" id="toast"></div>

<script>
// Same origin behind the Apache config that ships with this -
// image_xsection_apache.conf mounts the API at /xsection.  ?api=... points it
// elsewhere, which is how the page is opened against a development server:
//     image_xsection.html?api=http://127.0.0.1:8052
const QUERY = new URLSearchParams(location.search);
const API = QUERY.get('api') || '/xsection';

// The radar overlay comes from the WMS, not from this API.  Its mount differs
// between deployments (/baltrad_wsgi here, /wms elsewhere) and so do its layer
// names - cappi_* on one site, bufr_* on another - so both are settable and
// the layer list is read from GetCapabilities rather than assumed.
const WMS       = QUERY.get('wms')   || '/baltrad_wsgi';
const TOKEN_URL = QUERY.get('token') || '/get_token';

// Which overlay to show when nobody asked for one.  A page that comes up with
// the radar already on it is the point - drawing a line across an empty
// basemap and trusting your memory of where the weather was is what this
// replaces.  First of these that the server actually has wins; if it has none
// of them the overlay stays off rather than picking one of fifty-four at
// random.  ?layer= overrides, and whatever is chosen is remembered.
const PREFERRED_LAYERS = ['bufr_phenomena', 'bufr_dbz1',
                          'gimet_phenomena', 'gimet_dbz', 'baltrad_dbz'];

function rememberedLayer() {
  try { return localStorage.getItem('xsection.layer'); } catch (e) { return null; }
}
function rememberLayer(name) {
  try { localStorage.setItem('xsection.layer', name); } catch (e) { /* private mode */ }
}

// TWO CLOCKS.  The .wrk archive carries Moscow time and the WMS carries UTC,
// three hours apart.  The API reports both for every frame, `archive` and
// `utc`, and the rule here is: `archive` goes back to the API as ?time=, `utc`
// goes to the WMS as TIME.  Nothing on this page does the arithmetic - doing
// it here would bake one deployment's timezone into a file served to browsers.
let frames = [];        // [{archive, utc}], newest first
let wmsToken = null;
let wmsLayers = new Map();   // layer name -> Set of UTC times it can draw

// A section is worth sending to someone.  ?line=lon1,lat1,lon2,lat2 with an
// optional &family= and &time= reopens this one, and the page cuts it as soon
// as it knows what the archive holds.
const DEEP_LINK = (QUERY.get('line') || '').split(',').map(Number);

let family   = QUERY.get('family') || 'dbz';
let section  = null;       // the last cut, as the API sent it
let bands    = [];         // legend rows parsed into numeric ranges
let pts      = [];         // the drawn line, [lon,lat] pairs
let mode     = 'draw';

/* ── the map ─────────────────────────────────────────────────────────── */

const lineSource  = new ol.source.Vector();
const radarSource = new ol.source.Vector();

// The radar overlay.  ImageWMS, one request per view, the way demo.js asks for
// it - and like demo.js it appends the token at load time rather than putting
// it in `params`: the token is refreshed every thirty seconds and a stale one
// baked into the source's parameters would only be noticed as a 403 sometime
// later.  Building the URL here means every request carries the current one.
const wmsSource = new ol.source.ImageWMS({
  url: WMS,
  params: { LAYERS: '' },
  ratio: 1,
  // 'geoserver', the same value demo.js uses against this same endpoint.  The
  // backend is MapServer, so 'mapserver' is the more truthful label and only
  // changes what OpenLayers appends on a hidpi display - MAP_RESOLUTION
  // instead of FORMAT_OPTIONS=dpi.  Matching the page that is known to work
  // against this deployment is worth more than being right about that.
  serverType: 'geoserver',
  imageLoadFunction: (image, src) => {
    image.getImage().src = wmsToken
      ? src + (src.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(wmsToken)
      : src;
  }
});
const wmsLayer = new ol.layer.Image({ source: wmsSource, opacity: 0.65,
                                      visible: false });

const map = new ol.Map({
  target: 'map',
  layers: [
    new ol.layer.Tile({ source: new ol.source.OSM() }),
    wmsLayer,
    new ol.layer.Vector({
      source: radarSource,
      style: f => new ol.style.Style({
        image: new ol.style.Circle({
          radius: 5,
          fill:   new ol.style.Fill({ color: '#ff6b35' }),
          stroke: new ol.style.Stroke({ color: '#060a0f', width: 1.5 })
        }),
        text: new ol.style.Text({
          text: f.get('name'), offsetY: -13, font: '11px monospace',
          fill: new ol.style.Fill({ color: '#ff6b35' }),
          stroke: new ol.style.Stroke({ color: '#060a0f', width: 3 })
        })
      })
    }),
    new ol.layer.Vector({
      source: lineSource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: '#00c8ff', width: 2.5 }),
        image:  new ol.style.Circle({
          radius: 4, fill: new ol.style.Fill({ color: '#00c8ff' })
        })
      })
    })
  ],
  view: new ol.View({ center: ol.proj.fromLonLat([66, 56.7]), zoom: 6 })
});

map.on('click', e => {
  if (mode !== 'draw') return;
  const ll = ol.proj.toLonLat(e.coordinate);
  if (pts.length >= 2) pts = [];
  pts.push([+ll[0].toFixed(4), +ll[1].toFixed(4)]);
  drawLine();
  if (pts.length === 2) cut();
});

function drawLine() {
  lineSource.clear();
  pts.forEach(p => lineSource.addFeature(new ol.Feature({
    geometry: new ol.geom.Point(ol.proj.fromLonLat(p))
  })));
  if (pts.length === 2) {
    lineSource.addFeature(new ol.Feature({
      geometry: new ol.geom.LineString(pts.map(p => ol.proj.fromLonLat(p)))
    }));
  }
  document.getElementById('btn-cut').disabled = pts.length !== 2;
  document.getElementById('hint').textContent =
    pts.length === 0 ? 'Click to set the start point'
    : pts.length === 1 ? 'Click again for the end point'
    : 'Click once more to start a new line';

  const f = pts[0], t = pts[1];
  document.getElementById('line-info').innerHTML =
    '<b>From</b> ' + (f ? f[0].toFixed(3) + ', ' + f[1].toFixed(3) : '—') + '<br>' +
    '<b>To</b> '   + (t ? t[0].toFixed(3) + ', ' + t[1].toFixed(3) : '—') + '<br>' +
    '<b>Length</b> ' + (f && t ? haversine(f, t).toFixed(0) + ' km' : '—');
}

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[1] - a[1]) * rad, dLon = (b[0] - a[0]) * rad;
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-draw').classList.toggle('on', m === 'draw');
}
function clearLine() { pts = []; drawLine(); }

/* ── the legend, and colouring a value with it ───────────────────────── */

/* Labels come from the palette files: ">70", "65..70", "<=-50", and the two
   non-numeric rows at the end - "no echo" and "no data" - which are not
   bands and are dropped.  Parsed into [lo,hi) so a value can be looked up. */
function parseBands(rows) {
  const out = [];
  for (const r of rows) {
    const s = r.label.trim();
    let lo = null, hi = null, m;
    if ((m = s.match(/^>=?\s*(-?[\d.]+)$/)))       { lo = +m[1]; hi = Infinity; }
    else if ((m = s.match(/^<=?\s*(-?[\d.]+)$/)))  { lo = -Infinity; hi = +m[1]; }
    else if ((m = s.match(/^(-?[\d.]+)\.\.(-?[\d.]+)$/))) { lo = +m[1]; hi = +m[2]; }
    else continue;                       // "нет эхо" / "нет инф"
    out.push({ lo: Math.min(lo, hi), hi: Math.max(lo, hi),
               color: r.color, label: s });
  }
  return out;
}

function colorOf(v) {
  for (const b of bands) if (v >= b.lo && v < b.hi) return b.color;
  // above the top band or below the bottom one: clamp to the end it fell off
  if (bands.length) {
    const top = bands.reduce((a, b) => b.hi > a.hi ? b : a);
    const bot = bands.reduce((a, b) => b.lo < a.lo ? b : a);
    if (v >= top.hi) return top.color;
    if (v < bot.lo)  return bot.color;
  }
  return '#888';
}

function renderLegend(rows) {
  document.getElementById('legend').innerHTML = rows.map(r =>
    '<div class="lrow"><span class="sw" style="background:' + r.color +
    '"></span><span class="lb">' + escapeHtml(r.label) + '</span></div>'
  ).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

/* ── drawing the section ─────────────────────────────────────────────── */

const PAD = { l: 46, r: 8, t: 8, b: 26 };

function drawSection() {
  const wrap = document.getElementById('canvas-wrap');
  const cv   = document.getElementById('sect');
  const dpr  = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  if (!section) return;
  const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
  if (plotW <= 0 || plotH <= 0) return;

  const cols = section.width, rowsN = section.height;
  const cw = plotW / cols, ch = plotH / rowsN;

  // values[0] is the BOTTOM row - the API turns the engine's picture-order
  // rows over so the y axis ascends - so row r is drawn ch above the floor.
  //
  // The cell edges are snapped to whole pixels rather than drawn at their
  // fractional positions.  A fractional fillRect is antialiased against what
  // is under it, which turns a palette of seventeen colours into a gradient
  // of two thousand - and the colours matching the map exactly is the point
  // of taking them from the engine in the first place.  Snapping the far edge
  // to the next cell's near edge is what leaves no seam between them.
  for (let r = 0; r < rowsN; r++) {
    const row = section.values[r];
    const yTop = Math.round(PAD.t + plotH - (r + 1) * ch);
    const yBot = Math.round(PAD.t + plotH - r * ch);
    for (let c = 0; c < cols; c++) {
      const v = row[c];
      if (v === null) continue;
      const xL = Math.round(PAD.l + c * cw);
      const xR = Math.round(PAD.l + (c + 1) * cw);
      g.fillStyle = colorOf(v);
      g.fillRect(xL, yTop, Math.max(1, xR - xL), Math.max(1, yBot - yTop));
    }
  }

  // the beam floor: under it nothing looked, which is not the same as
  // nothing being there, so it is hatched rather than left blank
  g.save();
  g.beginPath();
  g.moveTo(PAD.l, PAD.t + plotH);
  for (let c = 0; c < cols; c++) {
    const km = section.floor_km[c];
    g.lineTo(PAD.l + c * cw, PAD.t + plotH - (km / section.top_km) * plotH);
  }
  g.lineTo(PAD.l + plotW, PAD.t + plotH);
  g.closePath();
  g.fillStyle = 'rgba(120,135,155,.13)';
  g.fill();
  g.strokeStyle = 'rgba(120,135,155,.4)';
  g.setLineDash([3, 3]);
  g.stroke();
  g.restore();

  // axes
  g.strokeStyle = '#1e2d3d';
  g.fillStyle   = '#6b7787';
  g.font        = '10px ui-monospace,monospace';
  g.lineWidth   = 1;
  g.beginPath();
  g.moveTo(PAD.l, PAD.t); g.lineTo(PAD.l, PAD.t + plotH);
  g.lineTo(PAD.l + plotW, PAD.t + plotH);
  g.stroke();

  const topKm = section.top_km;
  for (let km = 0; km <= topKm + .001; km += topKm > 8 ? 2 : 1) {
    const y = PAD.t + plotH - (km / topKm) * plotH;
    g.strokeStyle = 'rgba(30,45,61,.7)';
    g.beginPath(); g.moveTo(PAD.l, y); g.lineTo(PAD.l + plotW, y); g.stroke();
    g.textAlign = 'right'; g.textBaseline = 'middle';
    g.fillText(km + ' km', PAD.l - 5, y);
  }
  const L = section.length_km;
  const stepKm = niceStep(L);
  for (let d = 0; d <= L + .001; d += stepKm) {
    const x = PAD.l + (d / L) * plotW;
    g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(d.toFixed(0), x, PAD.t + plotH + 6);
  }
  g.textAlign = 'right';
  g.fillText('km along', PAD.l + plotW, PAD.t + plotH + 15);
}

function niceStep(span) {
  const raw = span / 6;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 5, 10].map(m => m * pow).find(s => s >= raw) || pow * 10;
}

/* hover: report the value under the cursor, in the engine's units */
document.getElementById('sect').addEventListener('mousemove', e => {
  const out = document.getElementById('readout');
  if (!section) { out.textContent = ''; return; }
  const wrap = document.getElementById('canvas-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
  const x = e.offsetX - PAD.l, y = e.offsetY - PAD.t;
  if (x < 0 || y < 0 || x > plotW || y > plotH) { out.textContent = ''; return; }

  const c = Math.min(section.width  - 1, Math.floor(x / plotW * section.width));
  const r = Math.min(section.height - 1,
                     Math.floor((plotH - y) / plotH * section.height));
  const v  = section.values[r][c];
  const km = (r / (section.height - 1)) * section.top_km;
  const d  = (c / (section.width  - 1)) * section.length_km;
  out.textContent = d.toFixed(0) + ' km, ' + km.toFixed(2) + ' km up  ·  ' +
                    (v === null ? 'no data' : v.toFixed(2) + ' ' + section.units);
});
document.getElementById('sect').addEventListener('mouseleave',
  () => document.getElementById('readout').textContent = '');

/* ── the radar overlay ───────────────────────────────────────────────── */

/* The WMS is token guarded: /get_token signs a short lived one, sixty seconds
   on this deployment, so it is refreshed on a timer well inside that.  A site
   with no token endpoint answers 404 and the overlay simply goes unguarded -
   which is what an older deployment looks like, not an error. */
async function refreshToken() {
  try {
    const res = await fetch(TOKEN_URL);
    if (!res.ok) return false;
    wmsToken = (await res.json()).token;
    return true;
  } catch (e) {
    return false;
  }
}

function wmsUrl(params) {
  const q = new URLSearchParams(params);
  if (wmsToken) q.set('token', wmsToken);
  return WMS + (WMS.includes('?') ? '&' : '?') + q;
}

/* The layer names differ between deployments, so they are read rather than
   assumed.  A failure here costs the overlay and nothing else: the section is
   this page's job and does not go through the WMS at all. */
async function loadWmsLayers() {
  const sel = document.getElementById('wms-layer');
  try {
    const res = await fetch(wmsUrl({ SERVICE: 'WMS', VERSION: '1.1.1',
                                     REQUEST: 'GetCapabilities' }));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');

    // Leaf layers only.  A Layer holding other Layers is the container - the
    // root one is named too ("baltrad_wms" here) and is not a map to draw.
    for (const el of xml.querySelectorAll('Layer')) {
      if (el.querySelector('Layer')) continue;
      const name = el.querySelector(':scope > Name');
      if (!name) continue;

      // What times this layer can actually draw.  It matters more here than
      // it looks: the WMS keeps a rolling window - fifteen frames, about two
      // and a half hours - while the archive this page cuts from goes back
      // months.  Most frames in the picker have no radar image at all, and
      // asking for one returns a blank PNG with a 200 next to it.
      // 1.1.1 puts the values in <Extent>, 1.3.0 in <Dimension>.
      const dim = el.querySelector(':scope > Extent[name="time"]') ||
                  el.querySelector(':scope > Dimension[name="time"]');
      const times = new Set((dim ? dim.textContent : '')
        .split(',').map(s => s.trim()).filter(Boolean));

      wmsLayers.set(name.textContent.trim(), times);
    }
    if (!wmsLayers.size) throw new Error('no named layers');

    sel.innerHTML = '<option value="">— none —</option>' +
      [...wmsLayers.keys()].map(n =>
        '<option value="' + n + '">' + escapeHtml(n) + '</option>').join('');

    const wanted = [QUERY.get('layer'), rememberedLayer(),
                    ...PREFERRED_LAYERS].find(n => n && wmsLayers.has(n));
    sel.value = wanted || '';
    markFramesWithImagery();
    if (sel.value) onWmsLayer();
  } catch (e) {
    sel.innerHTML = '<option value="">— unavailable —</option>';
    console.warn('radar overlay unavailable:', e.message);
  }
}

/* Put a dot on the frames the chosen layer can actually draw.  With fifteen
   of two hundred, knowing which before clicking is the difference between a
   picker and a guessing game. */
function markFramesWithImagery() {
  const times = wmsLayers.get(document.getElementById('wms-layer').value);
  const sel = document.getElementById('time');
  for (const opt of sel.options) {
    const frame = frames.find(f => f.archive === opt.value);
    const has = frame && times && times.has(frame.utc);
    opt.textContent = (has ? '● ' : '  ') +
      opt.value.replace('T', ' ') +
      (opt === sel.options[0] ? '  (latest)' : '');
  }
}

function onWmsLayer() {
  const layer = document.getElementById('wms-layer').value;
  if (layer) {
    wmsSource.updateParams({ LAYERS: layer });
    rememberLayer(layer);
  }
  markFramesWithImagery();
  syncWmsTime();
}

function onWmsOpacity(v) {
  wmsLayer.setOpacity(v / 100);
  document.getElementById('wms-opacity-val').textContent = v + '%';
}

/* The one place the two clocks meet.  The picker holds archive times; the WMS
   is told the `utc` the API paired with the selected one.  No arithmetic. */
function syncWmsTime() {
  const frame = selectedFrame();
  const layer = document.getElementById('wms-layer').value;
  const times = wmsLayers.get(layer);
  const note  = document.getElementById('wms-note');

  document.getElementById('time-utc').innerHTML =
    frame ? 'UTC <b>' + frame.utc + '</b>' : '&mdash;';

  // Both halves or neither.  Showing the layer before the frame list has
  // arrived sends a GetMap with no TIME, which a WMS answers with whatever is
  // latest - a different moment from the section, on screen for as long as it
  // takes the frames to load.
  if (!layer || !frame) {
    wmsLayer.setVisible(false);
    note.textContent = '';
    return;
  }

  // The WMS keeps a short rolling window and the archive does not, so most
  // frames have no image.  Asking anyway returns a fully transparent PNG with
  // a 200 beside it - nothing in the network tab looks wrong and the map just
  // stays empty.  Say it instead, and leave the overlay off: an overlay that
  // is silently blank is worse than one that is honestly absent.
  if (times && times.size && !times.has(frame.utc)) {
    wmsLayer.setVisible(false);
    const all = [...times].sort();
    note.textContent = 'no radar image at this time — the WMS holds ' +
      times.size + ' frames, ' + all[0].replace('T', ' ').replace('Z', '') +
      ' to ' + all[all.length - 1].replace('T', ' ').replace('Z', '') + ' UTC';
    return;
  }

  note.textContent = '';
  wmsSource.updateParams({ TIME: frame.utc });
  wmsLayer.setVisible(true);
}

function selectedFrame() {
  const v = document.getElementById('time').value;
  return frames.find(f => f.archive === v) || frames[0] || null;
}

/* ── talking to the API ──────────────────────────────────────────────── */

async function api(path) {
  const res  = await fetch(API + path);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function boot() {
  // The overlay is set up first and separately, so that an unreachable WMS
  // costs the overlay and not the page: the section does not go through it.
  await refreshToken();
  setInterval(refreshToken, 30000);
  loadWmsLayers();

  try {
    const h = await api('/health');
    setStatus(h.ok, h.ok ? h.frames + ' frames' : (h.error || 'no archive'));

    const info = await api('/info');
    showFrame(info);          // draws the family buttons too

    const fr = await api('/frames?limit=200');
    // This page and image_xsection_api.py are deployed as two files and can
    // drift apart.  /frames used to answer a flat `timestamps` list and now
    // answers `frames` of {archive, utc} pairs, so say which half is behind
    // rather than failing later on a property that is not there.
    if (!Array.isArray(fr.frames)) {
      throw new Error('the API is older than this page: /frames returned ' +
        (fr.timestamps ? 'a flat timestamps list' : 'no frame list') +
        '. Deploy image_xsection_api.py and image_xsection.html together.');
    }
    frames = fr.frames;
    const sel = document.getElementById('time');
    sel.innerHTML = frames.map((f, i) =>
      '<option value="' + f.archive + '">' + f.archive.replace('T', ' ') +
      (i === 0 ? '  (latest)' : '') + '</option>').join('');

    const wanted = QUERY.get('time');
    if (wanted && frames.some(f => f.archive === wanted)) sel.value = wanted;
    markFramesWithImagery();   // the caps may have landed before the frames
    syncWmsTime();

    if (DEEP_LINK.length === 4 && DEEP_LINK.every(Number.isFinite)) {
      pts = [[DEEP_LINK[0], DEEP_LINK[1]], [DEEP_LINK[2], DEEP_LINK[3]]];
      drawLine();
      map.getView().fit(
        new ol.geom.LineString(pts.map(p => ol.proj.fromLonLat(p))).getExtent(),
        { padding: [60, 60, 60, 60], maxZoom: 9 });
      cut();
    }
  } catch (e) {
    setStatus(false, e.message);
    toast(e.message, true);
  }
}

/* The header carries both clocks, labelled.  A single bare timestamp on a
   page that talks to a Moscow-time archive and a UTC WMS is the one thing
   guaranteed to be misread. */
function setFrameTime(archive, utc) {
  document.getElementById('frame-time').innerHTML =
    escapeHtml(archive.replace('T', ' ')) + ' <span class="z">MSK</span>' +
    (utc ? '  ·  ' + escapeHtml(utc) : '');
}

function showFrame(info) {
  setFrameTime(info.frame_time, info.frame_time_utc);
  document.getElementById('frame-info').innerHTML =
    '<b>Grid</b> ' + info.size + '² @ ' + (info.pixel_m / 1000) + ' km<br>' +
    '<b>Radars</b> ' + info.radars.length + '<br>' +
    Object.entries(info.levels).map(([k, v]) =>
      '<b>' + k + '</b> ' + v + ' levels').join('<br>');

  // The buttons belong to the frame as much as the panel above does.  They
  // used to be drawn once, at boot, and then left: the newest frame is often
  // part written - the pipeline lands reflectivity before velocity - so a
  // page opened at the wrong moment disabled Velocity and kept it disabled
  // for every frame after, while the panel beside it read "vel 10 levels".
  renderFamilies(info.families, info.levels);

  radarSource.clear();
  info.radars.forEach(r => {
    const f = new ol.Feature({
      geometry: new ol.geom.Point(ol.proj.fromLonLat([r.lon, r.lat]))
    });
    f.set('name', (r.name || '').trim());
    radarSource.addFeature(f);
  });
}

/* Every family is shown, including the ones this frame cannot be cut through.
   A section needs two levels of a family, and the newest frame is often part
   written - the pipeline lands reflectivity before velocity - so a button
   that vanishes for one cycle and returns the next reads as a bug.  Disabled
   and labelled with the reason reads as what it is. */
function renderFamilies(list, levels) {
  const names = { dbz: 'Reflectivity', zdr: 'ZDR', vel: 'Velocity' };
  const all = Object.keys(levels || {}).length ? Object.keys(levels)
                                              : list;
  document.getElementById('families').innerHTML = all.map(f => {
    const ok = list.includes(f);
    const n  = (levels || {})[f] || 0;
    return '<button class="' + (ok ? (f === family ? 'on' : '') : 'off') +
      '" data-f="' + f + '"' + (ok ? '' : ' disabled') +
      ' onclick="pickFamily(\'' + f + '\')" title="' +
      (ok ? n + ' levels in this frame'
          : n + ' level(s) in this frame — a section needs two') + '">' +
      (names[f] || f) + '</button>';
  }).join('');
  if (!list.includes(family) && list.length) family = list[0];
}

function pickFamily(f) {
  family = f;
  document.querySelectorAll('#families button').forEach(b =>
    b.classList.toggle('on', b.dataset.f === f));
  if (pts.length === 2) cut();
}

function onTime() {
  syncWmsTime();          // move the radar overlay with the picker
  api('/info?time=' + encodeURIComponent(document.getElementById('time').value))
    .then(showFrame).catch(e => toast(e.message, true));
  if (pts.length === 2) cut();
}

async function cut() {
  if (pts.length !== 2) return;
  veil(true, 'Cutting the section…');
  try {
    const q = new URLSearchParams({
      lon1: pts[0][0], lat1: pts[0][1],
      lon2: pts[1][0], lat2: pts[1][1],
      family: family,
      time: document.getElementById('time').value || 'latest'
    });
    section = await api('/xsection?' + q);
    bands = parseBands(section.legend);
    renderLegend(section.legend);

    document.getElementById('sect-title').textContent =
      section.title + '  (' + section.units + ')';
    document.getElementById('sect-meta').textContent =
      section.frame_time.replace('T', ' ') + '  ·  ' +
      section.length_km + ' km  ·  ' +
      section.levels + ' levels  ·  ' +
      section.base_km + '–' + section.top_km + ' km';
    setFrameTime(section.frame_time, section.frame_time_utc);
    drawSection();

    // keep the address bar on the section being shown, so the link in it is
    // always the one worth sending.  replaceState, not pushState: redrawing
    // after a family change is not a page to go Back to.
    const share = new URLSearchParams(location.search);
    share.set('line', [pts[0][0], pts[0][1], pts[1][0], pts[1][1]].join(','));
    share.set('family', family);
    share.set('time', document.getElementById('time').value || 'latest');
    history.replaceState(null, '', location.pathname + '?' + share);
  } catch (e) {
    section = null;
    drawSection();
    document.getElementById('sect-title').textContent = '—';
    document.getElementById('sect-meta').textContent = '';
    toast(e.message, true);
  } finally {
    veil(false);
  }
}

/* ── chrome ──────────────────────────────────────────────────────────── */

function setStatus(ok, msg) {
  document.getElementById('dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  document.getElementById('status').textContent = msg;
}
function veil(on, text) {
  document.getElementById('veil').classList.toggle('on', on);
  if (text) document.getElementById('veil-text').textContent = text;
}
let toastTimer;
function toast(msg, bad) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 5000);
}

/* drag the divider between the map and the section */
(function () {
  const grab = document.getElementById('grab');
  const panel = document.querySelector('.panel');
  let startY = 0, startH = 0;
  grab.addEventListener('mousedown', e => {
    startY = e.clientY; startH = panel.offsetHeight;
    const move = ev => {
      panel.style.height =
        Math.max(120, Math.min(window.innerHeight - 200,
                               startH + (startY - ev.clientY))) + 'px';
      map.updateSize(); drawSection();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    e.preventDefault();
  });
})();

window.addEventListener('resize', () => { map.updateSize(); drawSection(); });

drawLine();
boot();
</script>
</body>
</html>
